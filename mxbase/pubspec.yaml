name: mxbase
key: zero
description: A comprehensive base library for Flutter applications including utilities for networking, UI components, and extensions.
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  easy_refresh: ^3.4.0
  pull_to_refresh_flutter3: ^2.0.2
  flutter_spinkit: ^5.2.1
  # easy_localization: ^3.0.7+1
  event_bus: ^2.0.0
  auto_orientation: ^2.3.1
  cached_network_image: ^3.1.0
  flutter_cache_manager: ^3.1.2
  velocity_x: ^4.2.1
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^5.0.0
  flutter_screenutil: ^5.8.4
  shared_preferences: ^2.0.6
  fluttertoast: ^8.0.8
  go_router: ^14.8.1
  rxdart: ^0.28.0
  get_it: ^8.0.3
  lifecycle: ^0.10.0
  image: ^4.0.15
  webview_flutter: ^4.10.0
  flutter_swipe_action_cell: ^3.1.5
  photo_view: ^0.15.0
  video_player: ^2.6.0
  chewie: ^1.4.0
  flutter_svg: ^2.0.17
  sprintf: ^6.0.0
  http: ^1.2.2
  flutter_riverpod: ^2.6.1
  tap_debouncer: ^2.0.0
  logger: ^2.4.0
  intl: ^0.19.0
  clipboard: ^0.1.3
  flutter_custom_tab_bar: ^1.2.1
  jiffy: ^6.2.1
  crypto: ^3.0.1
  xrandom: ^0.7.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  intl: ^0.20.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' and Android 'package' identifiers should not ordinarily
  # be modified. They are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.leaf.fli.mxbase
        pluginClass: MxbasePlugin
      ios:
        pluginClass: MxbasePlugin

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
